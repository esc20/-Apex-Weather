<div class="busca-wrapper">
  <form [formGroup]="buscaForm">
    <div class="input-container">
      <span class="lupa-icon">🔍</span>
      <input 
        type="text" 
        formControlName="cidade" 
        placeholder="Digite o nome da cidade... (Ex: São Paulo)"
        autocomplete="off"
      />
    </div>
  </form>
</div>
